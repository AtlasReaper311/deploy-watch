name: Deploy

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: AtlasReaper311/atlas-infra/.github/workflows/deploy-worker.yml@717a8a2bb31053b638ce570e6576f911284ecf37 # atlas-infra deploy-worker: trim CF secrets + explicit --env=""
    with:
      worker_name: deploy-watch
      run_lint: true
      require_meta: true
    secrets: inherit
